                                                                                            <td className="px-4 py-2 text-slate-500">{item.brand}</td>
                                                                                            <td className="px-4 py-2">
                                                                                                <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">
                                                                                                    {item.categories}
                                                                                                </span>
                                                                                            </td>
                                                                                            <td className="px-4 py-2 text-right font-black text-brand-700 bg-brand-50/30">
                                                                                                {item.totalAmount}
                                                                                            </td>
                                                                                        </tr>
                                                                                    ))}
                                                                                </tbody>
                                                                            </table>
                                                                        </div>
                                                                    ) : (
                                                                        <p className="text-xs text-slate-400 italic text-center py-2">Belum ada pesanan bahan dicatat.</p>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            );

                                            const renderCategoryBreakdown = (dates, startIdx, weekTitle, weekBadgeStyle, weekBg) => (
                                                <div className="space-y-4 mb-6">
                                                    <div className={`flex items-center justify-between ${weekBg} border border-slate-200/80 px-3.5 py-2 rounded-lg`}>
                                                        <span className={`text-xs font-bold ${weekBadgeStyle} flex items-center gap-1.5`}>
                                                            <i className="ph-bold ph-calendar-blank text-sm"></i> {weekTitle} ({dates.length} Hari)
                                                        </span>
                                                    </div>
                                                    {dates.map((dateStr, idx) => {
                                                        const globalIdx = startIdx + idx;
                                                        const periodData = menuData[activePeriodId] || {};
                                                        const dayData = periodData[dateStr] || {};

                                                        return (
                                                            <div key={`cat-${dateStr}`} className="bg-white rounded-xl border border-slate-200 shadow-2xs overflow-hidden">
                                                                <div className="bg-slate-100 px-5 py-3 border-b border-slate-200 flex items-center justify-between">
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="bg-slate-800 text-white text-xs font-bold px-2 py-0.5 rounded">
                                                                            Hari #{globalIdx + 1}
                                                                        </span>
                                                                        <span className="font-bold text-slate-800 text-sm">{formatDate(dateStr)}</span>
                                                                    </div>
                                                                </div>

                                                                <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                    {CATEGORIES.map(cat => {
                                                                        const catItems = dayData[cat.id] || [];
                                                                        const dishName = dayData.menuNames?.[cat.id] || '';

                                                                        return (
                                                                            <div key={cat.id} className="border border-slate-200 rounded-lg p-3 bg-slate-50/50">
                                                                                <div className="flex items-center justify-between pb-2 border-b border-slate-200 mb-2">
                                                                                    <span className={`text-xs font-bold ${cat.color} flex items-center gap-1.5`}>
                                                                                        <i className={`ph-bold ${cat.icon}`}></i> {cat.name}
                                                                                    </span>
                                                                                    {dishName && (
                                                                                        <span className="text-[11px] font-extrabold bg-white border border-slate-200 px-2 py-0.5 rounded-full text-slate-700 shadow-2xs">
                                                                                            {dishName}
                                                                                        </span>
                                                                                    )}
                                                                                </div>

                                                                                {catItems.length === 0 ? (
                                                                                    <p className="text-[11px] text-slate-400 italic">Belum ada bahan</p>
                                                                                ) : (
                                                                                    <div className="space-y-1">
                                                                                        {catItems.map(item => (
                                                                                            <div key={item.id} className="flex items-center justify-between text-xs py-0.5">
                                                                                                <span className="text-slate-700 font-medium">
                                                                                                    {item.name} {item.brand && item.brand !== 'N/A' ? `(${item.brand})` : ''}
                                                                                                </span>
                                                                                                <span className="font-bold text-brand-700">{item.amountText}</span>
                                                                                            </div>
                                                                                        ))}
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            );

                                            return (
                                                <div className="space-y-6">
                                                    {summarySubTab === 'aggregate' && (
                                                        <div className="fade-in">
                                                            {week1Dates.length > 0 && renderDailyAggregates(week1Dates, 0, 'Minggu 1', 'text-brand-800', 'bg-brand-50/80')}
                                                            {week2Dates.length > 0 && renderDailyAggregates(week2Dates, week1Dates.length, 'Minggu 2', 'text-blue-800', 'bg-blue-50/80')}
                                                        </div>
                                                    )}

                                                    {summarySubTab === 'categories' && (
                                                        <div className="fade-in">
                                                            {week1Dates.length > 0 && renderCategoryBreakdown(week1Dates, 0, 'Minggu 1', 'text-brand-800', 'bg-brand-50/80')}
                                                            {week2Dates.length > 0 && renderCategoryBreakdown(week2Dates, week1Dates.length, 'Minggu 2', 'text-blue-800', 'bg-blue-50/80')}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })()
                                    )}
                                </div>
                            )}

                        </div>
                    </main>

                    {}
                    {/* Multi-Date Picker Modal */}
                    {multiDateModal.isOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden">
                                <div className="p-4 bg-brand-600 text-white flex items-center justify-between">
                                    <h3 className="font-extrabold text-sm flex items-center gap-2">
                                        <i className="ph-bold ph-calendar-plus text-base"></i> Pilih Tanggal ({multiDateModal.weekTarget === 'week1' ? 'Minggu 1' : 'Minggu 2'})
                                    </h3>
                                    <button onClick={() => setMultiDateModal({ isOpen: false, weekTarget: 'week1' })} className="p-1 rounded-lg hover:bg-white/10 transition-colors">
                                        <i className="ph-bold ph-x text-base"></i>
                                    </button>
                                </div>

                                <div className="p-4 space-y-4">
                                    <div className="flex items-center justify-between bg-slate-100 p-2 rounded-xl">
                                        <button 
                                            onClick={() => setModalMonth(new Date(modalMonth.getFullYear(), modalMonth.getMonth() - 1, 1))}
                                            className="p-1.5 hover:bg-white rounded-lg text-slate-700 transition-colors"
                                        >
                                            <i className="ph-bold ph-caret-left"></i>
                                        </button>
                                        <span className="text-xs font-extrabold text-slate-800">
                                            {modalMonth.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}
                                        </span>
                                        <button 
                                            onClick={() => setModalMonth(new Date(modalMonth.getFullYear(), modalMonth.getMonth() + 1, 1))}
                                            className="p-1.5 hover:bg-white rounded-lg text-slate-700 transition-colors"
                                        >
                                            <i className="ph-bold ph-caret-right"></i>
                                        </button>
                                    </div>

                                    {/* Workdays Shortcut Button */}
                                    <button 
                                        type="button"
                                        onClick={() => {
                                            const yr = modalMonth.getFullYear();
                                            const mo = modalMonth.getMonth();
                                            const daysInMo = new Date(yr, mo + 1, 0).getDate();
                                            const workdays = [];
                                            const globallyLocked = getGloballyLockedDates(activePeriodId, multiDateModal.weekTarget);

                                            for (let d = 1; d <= daysInMo; d++) {
                                                const dateObj = new Date(yr, mo, d);
                                                const dayOfWeek = dateObj.getDay();
                                                const dateStr = yr + '-' + String(mo + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                                                if (dayOfWeek >= 1 && dayOfWeek <= 5 && !globallyLocked.has(dateStr)) {
                                                    workdays.push(dateStr);
                                                }
                                            }
                                            setSelectedModalDates(workdays);
                                        }}
                                        className="w-full text-xs font-bold py-2 bg-brand-50 hover:bg-brand-100 text-brand-800 border border-brand-200 rounded-xl transition-colors flex items-center justify-center gap-1.5 shadow-2xs"
                                    >
                                        <i className="ph-bold ph-magic-wand text-sm"></i> Pilih Hari Kerja (Senin-Jumat) Bulan Ini
                                    </button>

                                    {/* Month Days Calendar Grid */}
                                    <div className="grid grid-cols-7 gap-1 text-center">
                                        {['Mg', 'Sn', 'Sl', 'Rb', 'Km', 'Jm', 'Sb'].map(d => (
                                            <span key={d} className="text-[10px] font-extrabold text-slate-400 py-1">{d}</span>
                                        ))}

                                        {(() => {
                                            const yr = modalMonth.getFullYear();
                                            const mo = modalMonth.getMonth();
                                            const firstDayIdx = new Date(yr, mo, 1).getDay();
                                            const daysInMo = new Date(yr, mo + 1, 0).getDate();
                                            const globallyLocked = getGloballyLockedDates(activePeriodId, multiDateModal.weekTarget);

                                            const cells = [];
                                            for (let i = 0; i < firstDayIdx; i++) {
                                                cells.push(<div key={`blank-${i}`} />);
                                            }

                                            for (let d = 1; d <= daysInMo; d++) {
                                                const dateStr = yr + '-' + String(mo + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                                                const isSelected = selectedModalDates.includes(dateStr);
                                                const isLocked = globallyLocked.has(dateStr);

                                                cells.push(
                                                    <button
                                                        key={dateStr}
                                                        disabled={isLocked}
                                                        onClick={() => {
                                                            if (isSelected) {
                                                                setSelectedModalDates(selectedModalDates.filter(s => s !== dateStr));
                                                            } else {
                                                                setSelectedModalDates([...selectedModalDates, dateStr]);
                                                            }
                                                        }}
                                                        className={`text-xs py-2 rounded-lg font-bold transition-all ${
                                                            isLocked
                                                                ? 'bg-slate-100 text-slate-300 cursor-not-allowed border border-slate-200/50'
                                                                : isSelected
                                                                ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30'
                                                                : 'hover:bg-slate-100 text-slate-700 border border-transparent'
                                                        }`}
                                                        title={isLocked ? "Tanggal sudah digunakan" : dateStr}
                                                    >
                                                        {d}
                                                    </button>
                                                );
                                            }

                                            return cells;
                                        })()}
                                    </div>

                                    <div className="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-100">
                                        <span>Terpilih: <strong>{selectedModalDates.length} Tanggal</strong></span>
                                        <button 
                                            onClick={() => setSelectedModalDates([])}
                                            className="text-slate-400 hover:text-slate-600 font-semibold"
                                        >
                                            Reset
                                        </button>
                                    </div>
                                </div>

                                <div className="p-3 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                                    <button 
                                        type="button" 
                                        onClick={() => setMultiDateModal({ isOpen: false, weekTarget: 'week1' })}
                                        className="px-3.5 py-1.5 text-xs font-bold text-slate-600 bg-slate-200 hover:bg-slate-300 rounded-lg transition-colors"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={handleSaveMultiDates}
                                        className="px-4 py-1.5 text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition-colors shadow-2xs"
                                    >
                                        Simpan Tanggal
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Master Ingredients & Resep Modal */}
                    {isMasterModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="p-4 border-b bg-brand-50 border-brand-200 text-brand-900 flex items-center justify-between">
                                    <div>
                                        <h3 className="font-extrabold text-sm flex items-center gap-2">
                                            <i className="ph-bold ph-bookmarks text-base"></i> Kelola Master Bahan & Resep Cloud
                                        </h3>
                                    </div>
                                    <button onClick={() => setIsMasterModalOpen(false)} className="p-1.5 rounded-lg hover:bg-black/10 text-slate-600 transition-colors">
                                        <i className="ph-bold ph-x text-base"></i>
                                    </button>
                                </div>

                                <div className="p-4 overflow-y-auto flex-1 space-y-4">
                                    <p className="text-xs text-slate-500">Pustaka resep master dan bahan makanan tersimpan secara real-time di Cloud.</p>
                                </div>

                                <div className="p-3 border-t border-slate-100 bg-slate-50 flex justify-end">
                                    <button 
                                        type="button" 
                                        onClick={() => setIsMasterModalOpen(false)}
                                        className="px-4 py-1.5 text-xs font-bold bg-slate-800 text-white rounded-lg hover:bg-slate-900"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Change Password Modal */}
                    {isChangePasswordModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden">
                                <div className="p-4 bg-emerald-600 text-white flex items-center justify-between">
                                    <h3 className="font-extrabold text-sm flex items-center gap-2">
                                        <i className="ph-bold ph-key text-base"></i> Ubah Password Anda ({currentUser.name})
                                    </h3>
                                    <button onClick={() => setIsChangePasswordModalOpen(false)} className="p-1 rounded-lg hover:bg-white/10 transition-colors">
                                        <i className="ph-bold ph-x text-base"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSavePasswordChange} className="p-5 space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Password Saat Ini:</label>
                                        <input 
                                            type="password"
                                            required
                                            value={oldPassword}
                                            onChange={e => setOldPassword(e.target.value)}
                                            className="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-brand-500"
                                            placeholder="Masukkan password lama"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Password Baru:</label>
                                        <input 
                                            type="password"
                                            required
                                            value={newPassword}
                                            onChange={e => setNewPassword(e.target.value)}
                                            className="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-brand-500"
                                            placeholder="Minimal 4 karakter"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Konfirmasi Password Baru:</label>
                                        <input 
                                            type="password"
                                            required
                                            value={confirmPassword}
                                            onChange={e => setConfirmPassword(e.target.value)}
                                            className="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-1 focus:ring-brand-500"
                                            placeholder="Ulangi password baru"
                                        />
                                    </div>

                                    <div className="pt-3 flex justify-end gap-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsChangePasswordModalOpen(false)}
                                            className="px-3.5 py-1.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-4 py-1.5 text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-2xs"
                                        >
                                            Simpan Password
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Manage Accounts Modal (Super Admin Addo Only) */}
                    {isManageAccountsModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
                                    <div>
                                        <h3 className="font-extrabold text-sm flex items-center gap-2">
                                            <i className="ph-bold ph-users-three text-base text-brand-400"></i> Kelola Akun Editor & Akses
                                        </h3>
                                        <p className="text-[10px] text-slate-300">Khusus Addo (Super Admin)</p>
                                    </div>
                                    <button onClick={() => setIsManageAccountsModalOpen(false)} className="p-1.5 rounded-lg hover:bg-white/10 text-slate-300 transition-colors">
                                        <i className="ph-bold ph-x text-base"></i>
                                    </button>
                                </div>

                                <div className="p-5 overflow-y-auto space-y-5">
                                    <form onSubmit={handleCreateNewEditor} className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                                        <h4 className="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
                                            <i className="ph-bold ph-user-plus text-brand-600"></i> Tambah Akun Editor Baru
                                        </h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            <input 
                                                type="text" 
                                                placeholder="Username Editor (Cth: Budi)" 
                                                value={newEditorUsername}
                                                onChange={e => setNewEditorUsername(e.target.value)}
                                                className="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-none focus:ring-1 focus:ring-brand-500 font-semibold"
                                                required
                                            />
                                            <input 
                                                type="password" 
                                                placeholder="Password" 
                                                value={newEditorPassword}
                                                onChange={e => setNewEditorPassword(e.target.value)}
                                                className="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-none focus:ring-1 focus:ring-brand-500 font-semibold"
                                                required
                                            />
                                        </div>
                                        <button 
                                            type="submit" 
                                            className="w-full py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-lg transition-colors flex items-center justify-center gap-1 shadow-2xs"
                                        >
                                            <i className="ph-bold ph-plus"></i> Buat Akun Editor Baru
                                        </button>
                                    </form>

                                    <div className="space-y-2">
                                        <h4 className="text-xs font-extrabold text-slate-700 flex items-center justify-between">
                                            <span>Daftar Akun Editor Terdaftar:</span>
                                            <span className="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">{Object.keys(accounts).length} Akun</span>
                                        </h4>

                                        <div className="space-y-2">
                                            {Object.entries(accounts).map(([key, acc]) => {
                                                const isThisTarget = resetTargetUser === acc.username;

                                                return (
                                                    <div key={key} className="bg-white border border-slate-200 rounded-xl p-3 flex flex-col gap-2 shadow-2xs">
                                                        <div className="flex items-center justify-between">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-slate-700 font-bold text-xs">
                                                                    {acc.username.charAt(0).toUpperCase()}
                                                                </div>
                                                                <div>
                                                                    <p className="text-xs font-bold text-slate-800">{acc.username}</p>
                                                                    <p className="text-[10px] text-slate-400">
                                                                        {acc.isSuperAdmin ? 'Super Admin' : 'Editor'}
                                                                    </p>
                                                                </div>
                                                            </div>

                                                            <button 
                                                                type="button"
                                                                onClick={() => {
                                                                    if (isThisTarget) {
                                                                        setResetTargetUser(null);
                                                                        setResetNewPassword('');
                                                                    } else {
                                                                        setResetTargetUser(acc.username);
                                                                        setResetNewPassword('');
                                                                    }
                                                                }}
                                                                className="text-xs font-bold text-brand-700 hover:text-brand-800 bg-brand-50 hover:bg-brand-100 px-2.5 py-1 rounded-lg border border-brand-200 transition-colors flex items-center gap-1"
                                                            >
                                                                <i className="ph-bold ph-arrow-counter-clockwise"></i> Reset Password
                                                            </button>
                                                        </div>

                                                        {isThisTarget && (
                                                            <div className="mt-1 pt-2 border-t border-slate-100 flex items-center gap-2 fade-in">
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Password Baru"
                                                                    value={resetNewPassword}
                                                                    onChange={e => setResetNewPassword(e.target.value)}
                                                                    className="w-full text-xs px-2.5 py-1.5 rounded border border-slate-300 bg-slate-50 focus:outline-none focus:ring-1 focus:ring-brand-500 font-medium"
                                                                    autoFocus
                                                                />
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => {
                                                                        if (!resetNewPassword.trim()) return;
                                                                        handleResetUserPassword(acc.username, resetNewPassword.trim());
                                                                    }}
                                                                    className="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-3 py-1.5 rounded shrink-0 shadow-2xs"
                                                                >
                                                                    Simpan
                                                                </button>
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => setResetTargetUser(null)}
                                                                    className="text-slate-400 hover:text-slate-600 text-xs px-1.5 py-1.5 shrink-0"
                                                                >
                                                                    Batal
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="p-3 border-t border-slate-100 bg-slate-50 flex justify-end">
                                    <button 
                                        type="button" 
                                        onClick={() => setIsManageAccountsModalOpen(false)}
                                        className="px-4 py-1.5 text-xs font-bold bg-slate-800 text-white rounded-lg hover:bg-slate-900"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
