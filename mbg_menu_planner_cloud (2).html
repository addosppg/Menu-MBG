        const app = initializeApp(firebaseConfig);

        window.FirebaseServices = {

            setDoc,

        window.dispatchEvent(new Event('firebase-ready'));

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        };

        const IngredientForm = ({ date, categoryId, onAdd, masterIngredients = [], onSaveToMaster, onOpenMasterModal, isEditor }) => {
            const [name, setName] = useState('');
            const [brand, setBrand] = useState('');
            const [amountText, setAmountText] = useState('');
            const [saveToMaster, setSaveToMaster] = useState(false);
            const [selectedMasterId, setSelectedMasterId] = useState('');

            if (!isEditor) return null;

            const handleMasterSelect = (e) => {
                const masterId = e.target.value;
                setSelectedMasterId(masterId);
                if (masterId) {
                    const item = masterIngredients.find(m => m.id === masterId);
                    if (item) {
                        setName(item.name || '');
                        setBrand(item.brand && item.brand !== 'N/A' ? item.brand : '');
                        setAmountText(item.amountText || '');
                    }
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name.trim() || !amountText.trim()) return;
                
                onAdd(date, categoryId, {
                    name: name.trim(),
                    brand: brand.trim() || 'N/A',
                    amountText: amountText.trim()
                });

                if (saveToMaster) {
                    onSaveToMaster(categoryId, {
                        name: name.trim(),
                        brand: brand.trim() || 'N/A',
                        amountText: amountText.trim()
                    });
                }

                setName('');
                setBrand('');
                setAmountText('');
                setSaveToMaster(false);
                setSelectedMasterId('');
            };

            return (
                <form onSubmit={handleSubmit} className="bg-slate-50 border border-slate-200/90 rounded-lg p-3 shadow-2xs space-y-2 mt-2">
                    <div className="flex items-center justify-between gap-2 pb-1.5 border-b border-slate-200/60 flex-wrap">
                        <div className="flex items-center gap-1.5 text-[11px] font-bold text-slate-600 flex-1 min-w-[220px]">
                            <i className="ph-bold ph-bookmark-simple text-brand-600 text-sm"></i>
                            <span className="shrink-0">Master Bahan:</span>
                            <select 
                                value={selectedMasterId} 
                                onChange={handleMasterSelect}
                                className="w-full text-xs px-2 py-1 rounded border border-slate-300 bg-white font-medium focus:outline-none focus:ring-1 focus:ring-brand-500 truncate"
                            >
                                <option value="">-- Pilih dari Bahan Tersimpan --</option>
                                {masterIngredients.map(m => (
                                    <option key={m.id} value={m.id}>{m.name} {m.brand && m.brand !== 'N/A' ? `(${m.brand})` : ''} - {m.amountText}</option>
                                ))}
                            </select>
                        </div>
                        <button 
                            type="button" 
                            onClick={() => onOpenMasterModal(categoryId)}
                            className="text-[11px] font-bold text-brand-700 hover:text-brand-800 bg-brand-50 hover:bg-brand-100 px-2.5 py-1 rounded-md border border-brand-200 transition-colors flex items-center gap-1 shrink-0"
                            title="Kelola Daftar Master Bahan"
                        >
                            <i className="ph-bold ph-gear"></i> Kelola Master
                        </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input 
                            type="text" 
                            placeholder="Nama Bahan (Cth: Beras)" 
                            value={name} 
                            onChange={e => setName(e.target.value)}
                            className="w-full text-xs px-2.5 py-1.5 rounded border border-slate-300 focus:outline-none focus:ring-1 focus:ring-brand-500 bg-white"
                            required
                        />
                        <input 
                            type="text" 
                            placeholder="Brand / Merk (Cth: Bulog)" 
                            value={brand} 
                            onChange={e => setBrand(e.target.value)}
                            className="w-full text-xs px-2.5 py-1.5 rounded border border-slate-300 focus:outline-none focus:ring-1 focus:ring-brand-500 bg-white"
                        />
                        <input 
                            type="text" 
                            placeholder="Jumlah (Cth: 5 Kg / 2 L)" 
                            value={amountText} 
                            onChange={e => setAmountText(e.target.value)}
                            className="w-full text-xs px-2.5 py-1.5 rounded border border-slate-300 focus:outline-none focus:ring-1 focus:ring-brand-500 bg-white"
                            required
                        />
                    </div>

                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 pt-1">

        const CloudLoginModal = ({ onLogin, defaultName = '', isAuthenticating, accounts = {} }) => {
            const [username, setUsername] = useState(defaultName);
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const activeAccounts = (accounts && Object.keys(accounts).length > 0) 
                ? accounts 
                : DEFAULT_INITIAL_STATE.accounts;

            const handleLogin = (e) => {
                e.preventDefault();
                setErrorMsg('');
                const trimmedName = username.trim();
                const lowerName = trimmedName.toLowerCase();

                const matchedAccount = activeAccounts[lowerName];

                if (matchedAccount) {
                    if (password !== matchedAccount.password) {
                        setErrorMsg(`Password salah untuk akun ${matchedAccount.username}!`);
                        return;
                    }
                    onLogin({ 
                        name: matchedAccount.username, 
                        role: 'editor', 
                        isSuperAdmin: !!matchedAccount.isSuperAdmin 
                    });
                } else {
                    setErrorMsg('Username tidak terdaftar sebagai Editor. Gunakan tombol "Masuk sebagai Tamu" untuk melihat rekap pesanan.');
                }
            };

            const handleGuestLogin = () => {
                onLogin({ name: 'Tamu / Guest', role: 'guest', isSuperAdmin: false });
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden fade-in">
                        <div className="p-6 bg-gradient-to-br from-brand-600 to-brand-800 text-white text-center">
                            <div className="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-md border border-white/20">
                                <i className="ph-bold ph-shield-check text-3xl text-white"></i>
                            </div>
                            <h2 className="text-xl font-extrabold tracking-tight">Login MBG Cloud Planner</h2>
                            <p className="text-xs text-brand-100 mt-1">Sistem Otentikasi & Hak Akses</p>
                        </div>

                        <div className="p-6 space-y-4">
                            {errorMsg && (
                                <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-xs font-bold flex items-center gap-2">
                                    <i className="ph-bold ph-warning-circle text-base shrink-0"></i>
                                    <span>{errorMsg}</span>
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Username Editor:</label>
                                    <input 
                                        type="text" 
                                        placeholder="Masukkan nama (Addo / Ichan / dll)"
                                        value={username}
                                        onChange={e => setUsername(e.target.value)}
                                        className="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 font-medium text-slate-800"
                                        required
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Password Editor:</label>
                                    <input 
                                        type="password" 
                                        placeholder="Masukkan Password"
                                        value={password}
                                        onChange={e => setPassword(e.target.value)}
                                        className="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 font-medium text-slate-800"
                                        required
                                    />
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={isAuthenticating}
                                    className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 disabled:bg-slate-400 text-white font-bold text-xs rounded-xl shadow-md transition-colors flex items-center justify-center gap-2"
                                >
                                    {isAuthenticating ? (
                                        <React.Fragment>
                                            <i className="ph-bold ph-spinner animate-spin"></i> Menghubungkan...
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            <i className="ph-bold ph-sign-in"></i> Masuk Editor
                                        </React.Fragment>
                                    )}
                                </button>
                            </form>

                            <div className="relative my-4">
                                <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div>
                                <div className="relative flex justify-center text-[10px] uppercase font-bold text-slate-400 bg-white px-2">Atau</div>
                            </div>

                            <button 
                                type="button"
                                onClick={handleGuestLogin}
                                disabled={isAuthenticating}
                                className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-bold text-xs rounded-xl transition-colors flex items-center justify-center gap-2 shadow-2xs"
                            >
                                <i className="ph-bold ph-eye text-brand-600 text-base"></i> Masuk sebagai Tamu (Lihat Rekap Pesanan)
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [fb, setFb] = useState(null);
            const [authUser, setAuthUser] = useState(null);
            const [isAuthenticating, setIsAuthenticating] = useState(true);
            const [cloudSynced, setCloudSynced] = useState(false);

            const [currentUser, setCurrentUser] = useState(null);
            const isEditor = currentUser?.role === 'editor';

            const [accounts, setAccounts] = useState(DEFAULT_INITIAL_STATE.accounts);
            const [periods, setPeriods] = useState(DEFAULT_INITIAL_STATE.periods);
            const [activePeriodId, setActivePeriodId] = useState('1');
            const [menuData, setMenuData] = useState(DEFAULT_INITIAL_STATE.menuData);

            const [masterIngredients, setMasterIngredients] = useState(DEFAULT_INITIAL_STATE.masterIngredients);
            const [masterMenus, setMasterMenus] = useState(DEFAULT_INITIAL_STATE.masterMenus);

            const [isChangePasswordModalOpen, setIsChangePasswordModalOpen] = useState(false);
            const [oldPassword, setOldPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');

            const [isManageAccountsModalOpen, setIsManageAccountsModalOpen] = useState(false);
            const [newEditorUsername, setNewEditorUsername] = useState('');
            const [newEditorPassword, setNewEditorPassword] = useState('');
            const [resetTargetUser, setResetTargetUser] = useState(null);
            const [resetNewPassword, setResetNewPassword] = useState('');

            const [isMasterModalOpen, setIsMasterModalOpen] = useState(false);
            const [activeMasterTab, setActiveMasterTab] = useState('karbo');

            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => {
                    setToast(prev => ({ ...prev, show: false }));
                }, 3500);
            };

            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isCreatingPeriod, setIsCreatingPeriod] = useState(false);
            const [newPeriodName, setNewPeriodName] = useState('');

            const [multiDateModal, setMultiDateModal] = useState({ isOpen: false, weekTarget: 'week1' });
            const [modalMonth, setModalMonth] = useState(new Date(2026, 8, 1));
            const [selectedModalDates, setSelectedModalDates] = useState([]);

            const [editingPeriodId, setEditingPeriodId] = useState(null);
            const [editingPeriodName, setEditingPeriodName] = useState('');

            const [activeTab, setActiveTab] = useState('planner'); 
            const [summarySubTab, setSummarySubTab] = useState('aggregate'); 
            const [activeDayKey, setActiveDayKey] = useState('2026-09-01');

            useEffect(() => {
                if (currentUser?.role === 'guest') {
                    setActiveTab('summary');
                }
            }, [currentUser]);

            const activePeriod = periods.find(p => p.id === activePeriodId) || periods[0] || { id: '1', name: 'Periode 1', week1Dates: [], week2Dates: [] };
            const week1Dates = activePeriod?.week1Dates || [];
            const week2Dates = activePeriod?.week2Dates || [];
            const allPeriodDates = [...week1Dates, ...week2Dates];

            useEffect(() => {
                const initFirebase = async () => {
                    if (window.FirebaseServices) {
                        const services = window.FirebaseServices;
                        setFb(services);
                        
                        try {
                            const { auth, signInAnonymously, signInWithCustomToken } = services;
                            let userCred = null;
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                userCred = await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                userCred = await signInAnonymously(auth);
                            }
                            setAuthUser(userCred.user);
                        } catch (err) {
                            console.error("Firebase auth error:", err);
                            try {
                                const userCred = await services.signInAnonymously(services.auth);
                                setAuthUser(userCred.user);
                            } catch (e) {
                                console.error("Anonymous auth failed:", e);
                            }
                        } finally {
                            setIsAuthenticating(false);
                        }
                    }
                };

                window.addEventListener('firebase-ready', initFirebase);
                if (window.FirebaseServices) {
                    initFirebase();
                }

                return () => window.removeEventListener('firebase-ready', initFirebase);
            }, []);

            useEffect(() => {
                if (!fb || !authUser) return;
                const { db, appId, doc, onSnapshot } = fb;

                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', authUser.uid);
                const unsubscribeUser = onSnapshot(userDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const profileData = docSnap.data();
                        setCurrentUser(profileData);
                    }
                }, (err) => console.error("User profile snapshot error:", err));

                const plannerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'plannerData', 'main');
                const unsubscribePlanner = onSnapshot(plannerDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.accounts) setAccounts(data.accounts);
                        if (data.periods) setPeriods(data.periods);
                        if (data.menuData) setMenuData(data.menuData);
                        if (data.masterIngredients) setMasterIngredients(data.masterIngredients);
                        if (data.masterMenus) setMasterMenus(data.masterMenus);
                        setCloudSynced(true);
                    }
                }, (err) => console.error("Planner data snapshot error:", err));

                return () => {
                    unsubscribeUser();
                    unsubscribePlanner();
                };
            }, [fb, authUser]);

            const saveToCloudState = async (updatedPeriods, updatedMenuData, updatedMasterIngredients, updatedMasterMenus, updatedAccounts) => {
                if (!fb || !authUser || !isEditor) return;
                const { db, appId, doc, setDoc } = fb;
                const plannerDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'plannerData', 'main');

                try {
                    await setDoc(plannerDocRef, {
                        accounts: updatedAccounts !== undefined ? updatedAccounts : accounts,
                        periods: updatedPeriods !== undefined ? updatedPeriods : periods,
                        menuData: updatedMenuData !== undefined ? updatedMenuData : menuData,
                        masterIngredients: updatedMasterIngredients !== undefined ? updatedMasterIngredients : masterIngredients,
                        masterMenus: updatedMasterMenus !== undefined ? updatedMasterMenus : masterMenus,
                        lastUpdatedBy: currentUser?.name || authUser.uid,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                } catch (err) {
                    console.error("Cloud save failed:", err);
                    showToast("Gagal menyinkronkan data ke Cloud!", "error");
                }
            };

            const handleCloudLogin = async (userProfile) => {
                setCurrentUser(userProfile);
                if (fb && authUser) {
                    const { db, appId, doc, setDoc } = fb;
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', authUser.uid);
                    try {
                        await setDoc(userDocRef, {
                            ...userProfile,
                            updatedAt: new Date().toISOString()
                        });
                    } catch (err) {
                        console.error("Failed to store user profile in cloud:", err);
                    }
                }
            };

            const handleSavePasswordChange = (e) => {
                e.preventDefault();
                const userKey = (currentUser?.name || '').toLowerCase();
                const currentAcc = accounts[userKey];

                if (!currentAcc || oldPassword !== currentAcc.password) {
                    showToast("Password lama salah!", "error");
                    return;
                }
                if (newPassword.length < 4) {
                    showToast("Password baru minimal 4 karakter!", "error");
                    return;
                }
                if (newPassword !== confirmPassword) {
                    showToast("Konfirmasi password baru tidak cocok!", "error");
                    return;
                }

                const updatedAccounts = {
                    ...accounts,
                    [userKey]: {
                        ...currentAcc,
                        password: newPassword
                    }
                };

                setAccounts(updatedAccounts);
                saveToCloudState(undefined, undefined, undefined, undefined, updatedAccounts);
                setIsChangePasswordModalOpen(false);
                setOldPassword('');
                setNewPassword('');
                setConfirmPassword('');
                showToast("Password berhasil diperbarui!", "success");
            };

            const handleCreateNewEditor = (e) => {
                e.preventDefault();
                const trimmedUser = newEditorUsername.trim();
                const userKey = trimmedUser.toLowerCase();

                if (!trimmedUser || !newEditorPassword) return;

                if (accounts[userKey]) {
                    showToast(`Akun "${trimmedUser}" sudah ada!`, "error");
                    return;
                }

                const updatedAccounts = {
                    ...accounts,
                    [userKey]: {
                        username: trimmedUser,
                        password: newEditorPassword,
                        isSuperAdmin: false
                    }
                };

                setAccounts(updatedAccounts);
                saveToCloudState(undefined, undefined, undefined, undefined, updatedAccounts);
                setNewEditorUsername('');
                setNewEditorPassword('');
                showToast(`Akun Editor "${trimmedUser}" berhasil dibuat!`, "success");
            };

            const handleResetUserPassword = (targetUsername, newPass) => {
                const userKey = targetUsername.toLowerCase();
                if (!accounts[userKey]) return;

                const updatedAccounts = {
                    ...accounts,
                    [userKey]: {
                        ...accounts[userKey],
                        password: newPass
                    }
                };

                setAccounts(updatedAccounts);
                saveToCloudState(undefined, undefined, undefined, undefined, updatedAccounts);
                setResetTargetUser(null);
                setResetNewPassword('');
                showToast(`Password untuk "${targetUsername}" berhasil direset!`, "success");
            };

            const addIngredient = (dateStr, catId, newItem) => {
                if (!isEditor) return;
                const periodData = menuData[activePeriodId] || {};
                const dayData = periodData[dateStr] || {};
                const currentList = dayData[catId] || [];

                const itemWithId = { ...newItem, id: 'ing-' + Date.now() + '-' + Math.random().toString(36).substring(2, 5) };

                const updatedMenuData = {
                    ...menuData,
                    [activePeriodId]: {
                        ...periodData,
                        [dateStr]: {
                            ...dayData,
                            [catId]: [...currentList, itemWithId]
                        }
                    }
                };

                setMenuData(updatedMenuData);
                saveToCloudState(undefined, updatedMenuData);
            };

            const removeIngredient = (dateStr, catId, itemId) => {
                if (!isEditor) return;
                const periodData = menuData[activePeriodId] || {};
                const dayData = periodData[dateStr] || {};
                const currentList = dayData[catId] || [];

                const updatedList = currentList.filter(item => item.id !== itemId);

                const updatedMenuData = {
                    ...menuData,
                    [activePeriodId]: {
                        ...periodData,
                        [dateStr]: {
                            ...dayData,
                            [catId]: updatedList
                        }
                    }
                };

                setMenuData(updatedMenuData);
                saveToCloudState(undefined, updatedMenuData);
            };

            const updateMenuName = (dateStr, catId, name) => {
                if (!isEditor) return;
                const periodData = menuData[activePeriodId] || {};
                const dayData = periodData[dateStr] || {};
                const currentNames = dayData.menuNames || {};

                const updatedMenuData = {
                    ...menuData,
                    [activePeriodId]: {
                        ...periodData,
                        [dateStr]: {
                            ...dayData,
                            menuNames: {
                                ...currentNames,
                                [catId]: name
                            }
                        }
                    }
                };

                setMenuData(updatedMenuData);
                saveToCloudState(undefined, updatedMenuData);
            };

            const handleSaveToMaster = (catId, item) => {
                if (!isEditor) return;
                const currentMasterList = masterIngredients[catId] || [];
                const itemWithId = { ...item, id: 'm-' + Date.now() };

                const updatedMaster = {
                    ...masterIngredients,
                    [catId]: [...currentMasterList, itemWithId]
                };

                setMasterIngredients(updatedMaster);
                saveToCloudState(undefined, undefined, updatedMaster);
                showToast(`Bahan "${item.name}" disimpan ke Master Bahan!`, "success");
            };

            const handleSaveCurrentMenuToMaster = (dateStr, catId) => {
                if (!isEditor) return;
                const periodData = menuData[activePeriodId] || {};
                const dayData = periodData[dateStr] || {};
                const currentMenuName = dayData.menuNames?.[catId] || '';
                const currentIngredients = dayData[catId] || [];

                if (!currentMenuName.trim()) {
                    showToast("Isi Nama Menu terlebih dahulu sebelum menyimpan!", "error");
                    return;
                }
                if (currentIngredients.length === 0) {
                    showToast("Tambahkan minimal 1 bahan makanan sebelum menyimpan resep!", "error");
                    return;
                }

                const currentCategoryMenus = masterMenus[catId] || [];
                const newPreset = {
                    id: 'mm-' + Date.now(),
                    name: currentMenuName.trim(),
                    ingredients: currentIngredients.map(ing => ({
                        name: ing.name,
                        brand: ing.brand || 'N/A',
                        amountText: ing.amountText
                    }))
                };

                const updatedMasterMenus = {
                    ...masterMenus,
                    [catId]: [...currentCategoryMenus, newPreset]
                };

                setMasterMenus(updatedMasterMenus);
                saveToCloudState(undefined, undefined, undefined, updatedMasterMenus);
                showToast(`Resep "${currentMenuName}" berhasil disimpan ke Master Resep!`, "success");
            };

            const handleApplyMasterMenu = (dateStr, catId, masterMenuId) => {
                if (!isEditor || !masterMenuId) return;
                const categoryPresets = masterMenus[catId] || [];
                const targetPreset = categoryPresets.find(m => m.id === masterMenuId);
                if (!targetPreset) return;

                const periodData = menuData[activePeriodId] || {};
                const dayData = periodData[dateStr] || {};
                const currentNames = dayData.menuNames || {};

                const newIngredients = targetPreset.ingredients.map(ing => ({
                    id: 'ing-' + Date.now() + '-' + Math.random().toString(36).substring(2, 5),
                    name: ing.name,
                    brand: ing.brand || 'N/A',
                    amountText: ing.amountText
                }));

                const updatedMenuData = {
                    ...menuData,
                    [activePeriodId]: {
                        ...periodData,
                        [dateStr]: {
                            ...dayData,
                            menuNames: {
                                ...currentNames,
                                [catId]: targetPreset.name
                            },
                            [catId]: newIngredients
                        }
                    }
                };

                setMenuData(updatedMenuData);
                saveToCloudState(undefined, updatedMenuData);
                showToast(`Resep "${targetPreset.name}" berhasil dimuat!`, "success");
            };

            const handleCreatePeriod = (e) => {
                e.preventDefault();
                if (!newPeriodName.trim() || !isEditor) return;

                const newP = {
                    id: Date.now().toString(),
                    name: newPeriodName.trim(),
                    week1Dates: [],
                    week2Dates: []
                };

                const updatedPeriods = [...periods, newP];
                setPeriods(updatedPeriods);
                setActivePeriodId(newP.id);
                setNewPeriodName('');
                setIsCreatingPeriod(false);
                saveToCloudState(updatedPeriods);
                showToast(`Periode "${newP.name}" berhasil dibuat!`, "success");
            };

            const handleSaveRenamePeriod = (periodId) => {
                if (!editingPeriodName.trim() || !isEditor) return;
                const updatedPeriods = periods.map(p => p.id === periodId ? { ...p, name: editingPeriodName.trim() } : p);
                setPeriods(updatedPeriods);
                setEditingPeriodId(null);
                setEditingPeriodName('');
                saveToCloudState(updatedPeriods);
                showToast("Nama periode diperbarui!", "success");
            };

            const handleDeletePeriod = (periodId, e) => {
                e.stopPropagation();
                if (!isEditor || periods.length <= 1) return;
                const updatedPeriods = periods.filter(p => p.id !== periodId);
                setPeriods(updatedPeriods);
                if (activePeriodId === periodId) {
                    setActivePeriodId(updatedPeriods[0]?.id || '1');
                }
                saveToCloudState(updatedPeriods);
                showToast("Periode berhasil dihapus!", "success");
            };

            const openMultiDateModal = (weekTarget) => {
                if (!isEditor) return;
                const currentDates = weekTarget === 'week1' ? week1Dates : week2Dates;
                setSelectedModalDates([...currentDates]);
                setMultiDateModal({ isOpen: true, weekTarget });
            };

            const getGloballyLockedDates = (currentPeriodId, currentWeekTarget) => {
                const lockedSet = new Set();
                periods.forEach(p => {
                    const isSamePeriod = p.id === currentPeriodId;
                    if (!isSamePeriod || currentWeekTarget !== 'week1') {
                        (p.week1Dates || []).forEach(d => lockedSet.add(d));
                    }
                    if (!isSamePeriod || currentWeekTarget !== 'week2') {
                        (p.week2Dates || []).forEach(d => lockedSet.add(d));
                    }
                });
                return lockedSet;
            };

            const handleSaveMultiDates = () => {
                if (!isEditor) return;
                const { weekTarget } = multiDateModal;
                const sorted = [...selectedModalDates].sort();

                const updatedPeriods = periods.map(p => {
                    if (p.id === activePeriodId) {
                        return {
                            ...p,
                            [weekTarget === 'week1' ? 'week1Dates' : 'week2Dates']: sorted
                        };
                    }
                    return p;
                });

                setPeriods(updatedPeriods);
                setMultiDateModal({ isOpen: false, weekTarget: 'week1' });
                saveToCloudState(updatedPeriods);

                if (sorted.length > 0) {
                    setActiveDayKey(sorted[0]);
                }
                showToast("Daftar tanggal berhasil diperbarui!", "success");
            };

            const handleRemoveDateFromPeriod = (dateStr, weekTarget) => {
                if (!isEditor) return;
                const currentDates = weekTarget === 'week1' ? week1Dates : week2Dates;
                const updatedDates = currentDates.filter(d => d !== dateStr);

                const updatedPeriods = periods.map(p => {
                    if (p.id === activePeriodId) {
                        return {
                            ...p,
                            [weekTarget === 'week1' ? 'week1Dates' : 'week2Dates']: updatedDates
                        };
                    }
                    return p;
                });

                setPeriods(updatedPeriods);
                saveToCloudState(updatedPeriods);
            };

            const openMasterModalWithCategory = (catId) => {
                setActiveMasterTab(catId);
                setIsMasterModalOpen(true);
            };

            const getDaySummary = (dateStr) => {
                const periodData = menuData[activePeriodId] || {};
                const dayData = periodData[dateStr] || {};
                const summaryMap = {};

                CATEGORIES.forEach(cat => {
                    const catItems = dayData[cat.id] || [];
                    catItems.forEach(item => {
                        const key = (item.name + '___' + (item.brand || 'N/A')).toLowerCase();
                        if (!summaryMap[key]) {
                            summaryMap[key] = {
                                name: item.name,
                                brand: item.brand || 'N/A',
                                categories: cat.name,
                                amounts: [item.amountText]
                            };
                        } else {
                            summaryMap[key].amounts.push(item.amountText);
                            if (!summaryMap[key].categories.includes(cat.name)) {
                                summaryMap[key].categories += ', ' + cat.name;
                            }
                        }
                    });
                });

                return Object.values(summaryMap).map(item => ({
                    name: item.name,
                    brand: item.brand,
                    categories: item.categories,
                    totalAmount: item.amounts.join(' + ')
                }));
            };

            if (!currentUser) {
                return (
                    <CloudLoginModal 
                        onLogin={handleCloudLogin} 
                        defaultName={authUser?.uid ? `Pengguna-${authUser.uid.substring(0, 4)}` : ''}
                        isAuthenticating={isAuthenticating}
                        accounts={accounts}
                    />
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50 relative">
                    
                    {/* Toast Notification */}
                    {toast.show && (
                        <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border text-xs font-bold fade-in transition-all ${
                            toast.type === 'error' 
                                ? 'bg-red-600 text-white border-red-700' 
                                : 'bg-slate-900 text-white border-slate-700'
                        }`}>
                            <i className={`ph-bold ${toast.type === 'error' ? 'ph-warning-circle text-lg text-red-200' : 'ph-check-circle text-lg text-emerald-400'}`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Mobile Header Toggle */}
                    <div className="md:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                                <i className="ph-bold ph-bowl-food"></i>
                            </div>
                            <h1 className="font-bold text-slate-800 text-base">MBG Cloud Planner</h1>
                        </div>
                        <button 
                            onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                            className="p-2 rounded-lg text-slate-600 hover:bg-slate-100"
                        >
                            <i className={`ph-bold ${isSidebarOpen ? 'ph-x' : 'ph-list'} text-xl`}></i>
                        </button>
                    </div>

                    {/* Sidebar Navigation */}
                    <aside className={`
                        fixed inset-y-0 left-0 z-20 w-80 bg-white border-r border-slate-200 flex flex-col transition-transform duration-300 ease-in-out md:static md:translate-x-0
                        ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}
                    `}>
                        <div className="p-5 border-b border-slate-100 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-brand-500/20">
                                    <i className="ph-bold ph-bowl-food"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-900 text-sm tracking-tight">Perencana Menu MBG</h1>
                                    <p className="text-[11px] text-slate-400 font-medium">Cloud Auth & Realtime Sync</p>
                                </div>
                            </div>
                        </div>

                        <div className="px-4 pt-3">
                            <div className="px-3 py-1.5 rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-between text-[11px]">
                                <div className="flex items-center gap-1.5">
                                    <span className={`w-2 h-2 rounded-full ${cloudSynced ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                                    <span className="font-semibold text-slate-700">{cloudSynced ? 'Terhubung ke Cloud' : 'Menyingkronkan...'}</span>
                                </div>
                                <i className="ph-bold ph-cloud-check text-brand-600 text-sm"></i>
                            </div>
                        </div>

                        <div className="px-4 pt-2">
                            <div className={`p-2.5 rounded-xl border flex flex-col gap-2 ${
                                isEditor 
                                    ? 'bg-emerald-50 border-emerald-200 text-emerald-900' 
                                    : 'bg-amber-50 border-amber-200 text-amber-900'
                            }`}>
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2 truncate">
                                        <i className={`ph-bold ${isEditor ? 'ph-pencil-simple-line text-emerald-600' : 'ph-eye text-amber-600'} text-base shrink-0`}></i>
                                        <div className="truncate">
                                            <p className="text-xs font-extrabold truncate">{currentUser.name}</p>
                                            <p className="text-[10px] opacity-80 font-semibold uppercase tracking-wider">
                                                {isEditor ? (currentUser.isSuperAdmin || currentUser.name.toLowerCase() === 'addo' ? 'Super Admin / Editor' : 'Akses Editor') : 'Akses Tamu (Rekap Saja)'}
                                            </p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setCurrentUser(null)}
                                        className="p-1 hover:bg-black/10 rounded transition-colors text-slate-600 shrink-0"
                                        title="Ganti Peran / Keluar"
                                    >
                                        <i className="ph-bold ph-sign-out text-sm"></i>
                                    </button>
                                </div>

                                {isEditor && (
                                    <div className="flex items-center gap-1.5 pt-1.5 border-t border-emerald-200/60">
                                        <button
                                            onClick={() => setIsChangePasswordModalOpen(true)}
                                            className="flex-1 text-[10px] font-bold py-1 px-2 rounded-lg bg-white hover:bg-emerald-100/60 text-emerald-800 border border-emerald-300 flex items-center justify-center gap-1 transition-colors shadow-2xs"
                                        >
                                            <i className="ph-bold ph-key text-xs"></i> Ubah Password
                                        </button>
                                        {(currentUser.isSuperAdmin || currentUser.name.toLowerCase() === 'addo') && (
                                            <button
                                                onClick={() => setIsManageAccountsModalOpen(true)}
                                                className="flex-1 text-[10px] font-bold py-1 px-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white flex items-center justify-center gap-1 transition-colors shadow-2xs"
                                            >
                                                <i className="ph-bold ph-users-three text-xs"></i> Kelola Akun
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-6">
                            
                            {/* Periods Section */}
                            <div>
                                <div className="flex items-center justify-between mb-3">
                                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                                        <i className="ph-bold ph-calendar-check text-brand-600"></i> Pilih Periode
                                    </span>
                                    {isEditor && (
                                        <button 
                                            onClick={() => setIsCreatingPeriod(true)}
                                            className="text-xs text-brand-700 hover:text-brand-800 font-semibold flex items-center gap-1 bg-brand-50 hover:bg-brand-100 px-2 py-1 rounded transition-colors"
                                        >
                                            <i className="ph-bold ph-plus"></i> Periode Baru
                                        </button>
                                    )}
                                </div>

                                {isCreatingPeriod && isEditor && (
                                    <form onSubmit={handleCreatePeriod} className="mb-3 bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-2 fade-in">
                                        <input 
                                            type="text" 
                                            placeholder="Nama Periode (Cth: Periode 2)" 
                                            value={newPeriodName}
                                            onChange={e => setNewPeriodName(e.target.value)}
                                            className="w-full text-xs px-2.5 py-1.5 rounded border border-slate-300 bg-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                                            autoFocus
                                            required
                                        />
                                        <div className="flex gap-2 justify-end">
                                            <button 
                                                type="button" 
                                                onClick={() => setIsCreatingPeriod(false)}
                                                className="px-2.5 py-1 text-xs text-slate-600 hover:bg-slate-200 rounded font-medium"
                                            >
                                                Batal
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="px-2.5 py-1 text-xs bg-brand-600 text-white rounded font-medium hover:bg-brand-700"
                                            >
                                                Simpan
                                            </button>
                                        </div>
                                    </form>
                                )}

                                <div className="space-y-1.5">
                                    {periods.map(period => {
                                        const pW1 = period.week1Dates || [];
                                        const pW2 = period.week2Dates || [];
                                        const totalDays = pW1.length + pW2.length;
                                        const isEditingThis = editingPeriodId === period.id;

                                        if (isEditingThis && isEditor) {
                                            return (
                                                <form key={period.id} onSubmit={(e) => { e.preventDefault(); handleSaveRenamePeriod(period.id); }} className="flex items-center gap-1.5 p-1.5 bg-brand-50 rounded-xl border border-brand-300">
                                                    <input 
                                                        type="text" 
                                                        value={editingPeriodName} 
                                                        onChange={e => setEditingPeriodName(e.target.value)}
                                                        className="w-full text-xs px-2 py-1 rounded border border-brand-300 focus:outline-none focus:ring-1 focus:ring-brand-500 bg-white font-medium"
                                                        autoFocus
                                                    />
                                                    <button type="submit" className="p-1 text-brand-700 hover:bg-brand-200 rounded font-bold" title="Simpan">
                                                        <i className="ph-bold ph-check"></i>
                                                    </button>
                                                    <button type="button" onClick={() => setEditingPeriodId(null)} className="p-1 text-slate-400 hover:bg-slate-200 rounded" title="Batal">
                                                        <i className="ph-bold ph-x"></i>
                                                    </button>
                                                </form>
                                            );
                                        }

                                        return (
                                            <div 
                                                key={period.id}
                                                onClick={() => { setActivePeriodId(period.id); setIsSidebarOpen(false); }}
                                                className={`w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between cursor-pointer transition-all ${
                                                    activePeriodId === period.id 
                                                        ? 'bg-brand-600 text-white shadow-md shadow-brand-600/20' 
                                                        : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200/60'
                                                }`}
                                            >
                                                <div className="truncate flex items-center gap-2">
                                                    <i className={`ph-bold ${activePeriodId === period.id ? 'ph-calendar-star' : 'ph-calendar'} text-sm`}></i>
                                                    <span className="truncate">{period.name}</span>
                                                    <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${activePeriodId === period.id ? 'bg-brand-700 text-white' : 'bg-slate-200 text-slate-600'}`}>
                                                        {totalDays} hari
                                                    </span>
                                                </div>
                                                {isEditor && (
                                                    <div className="flex items-center gap-1">
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                setEditingPeriodId(period.id);
                                                                setEditingPeriodName(period.name);
                                                            }}
                                                            className={`p-1 rounded hover:opacity-100 opacity-60 transition-opacity ${activePeriodId === period.id ? 'hover:bg-brand-700 text-white' : 'hover:bg-slate-200 text-slate-500'}`}
                                                            title="Ubah Nama Periode"
                                                        >
                                                            <i className="ph-bold ph-pencil-simple"></i>
                                                        </button>
                                                        {periods.length > 1 && (
                                                            <button 
                                                                onClick={(e) => handleDeletePeriod(period.id, e)}
                                                                className={`p-1 rounded hover:opacity-100 opacity-60 transition-opacity ${activePeriodId === period.id ? 'hover:bg-brand-700 text-white' : 'hover:bg-slate-200 text-slate-500'}`}
                                                                title="Hapus Periode"
                                                            >
                                                                <i className="ph-bold ph-trash"></i>
                                                            </button>
